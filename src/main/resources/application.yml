spring:
  application:
    name: inventory-management

  datasource:
    hikari:
      data-source-properties:
        # 세션 단위 Postgres 타임아웃. 상품 행 락을 오래 기다리거나(lock_timeout, SQLState 55P03)
        # 쿼리가 오래 걸리면(statement_timeout, 57014) 커넥션을 무한정 붙잡지 않고 실패시킨다.
        # 애플리케이션에서는 503 STOCK_LOCK_TIMEOUT으로 응답한다.
        options: -c lock_timeout=${DB_LOCK_TIMEOUT:3s} -c statement_timeout=${DB_STATEMENT_TIMEOUT:5s}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    deserialization:
      # 재고 수량은 정수만 허용한다. 기본값(true)이면 1.9가 1로 잘려 조용히 처리되므로 끈다.
      accept-float-as-int: false
      # 요청 DTO에 없는 필드(오타, 출고의 productName 등)는 무시하지 않고 400으로 거부한다.
      fail-on-unknown-properties: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  # 응답 미디어 타입을 */* 대신 application/json으로 표기한다.
  default-produces-media-type: application/json
  # @RestControllerAdvice의 핸들러를 모든 API의 공통 응답으로 자동 추가하지 않는다.
  # 에러 응답은 API마다 실제로 발생하는 것만 명시한다.
  override-with-generic-response: false
  swagger-ui:
    operations-sorter: method
