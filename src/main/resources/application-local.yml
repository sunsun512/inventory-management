spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: ${DB_USERNAME:inventory-user}
    password: ${DB_PASSWORD:inventory-password}
    hikari:
      pool-name: hikari-rw-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:4}
      validation-timeout: 1000
      max-lifetime: 600000
      idle-timeout: 300000
      leak-detection-threshold: 10000

  sql:
    init:
      # 기동 시 data.sql(로컬 시드 데이터)을 Flyway 마이그레이션 뒤에 실행한다. 테이블이 비어 있을 때만 넣는다.
      # 끄려면 DB_SEED_MODE=never. (spring.jpa.defer-datasource-initialization은 Flyway와 순환 의존이 생겨 쓰지 않는다.)
      mode: ${DB_SEED_MODE:always}
      # data.sql의 DO $$ ... $$ 블록 안 ;에서 문장이 잘리지 않도록 파일 전체를 한 문장으로 실행한다.
      separator: ^^^ END OF SCRIPT ^^^

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      # 로컬에서는 디버깅을 위해 DB 종류, 디스크 용량 등 상세 정보까지 보여준다.
      show-details: always

logging:
  level:
    com.example.inventory.management: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
